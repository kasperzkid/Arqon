[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arqon-backend"
version = "0.1.0"
description = "Arqon — rule-based Solana security analysis platform (FastAPI API)."
readme = "../README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.30.6",
    "pydantic>=2.10.4",
    "pydantic-settings>=2.7.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "httpx>=0.27.0",
    "solders>=0.23.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
